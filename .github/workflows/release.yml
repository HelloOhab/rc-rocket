name: Release

# Tag a version and this lints it, tests it, and publishes the zip as a
# release asset. Attaching a real asset matters: GitHub's generated source
# archive unpacks to a folder named repo-tag rather than rc-rocket, which
# would install a second, deactivated copy of the plugin beside the first.
#
# Releases are published as pre-releases. Only sites with
# RC_ROCKET_UPDATE_CHANNEL set to 'beta' see them. Once those sites check out
# (tools/compare), edit the release on GitHub and untick "Set as a
# pre-release": it becomes the latest release and every site is offered it.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Check the tag matches the plugin header
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -oP '(?<=Version:           )[0-9.]+' rc-rocket.php)
          if [ "$TAG" != "$HEADER" ]; then
            echo "Tag $TAG does not match rc-rocket.php ($HEADER)." >&2
            exit 1
          fi
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Lint every PHP file
        run: |
          find . -name '*.php' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null

      - name: Run the test suites
        run: |
          for f in tests/run*.php; do
            echo "--- $f"
            php "$f" | tail -1
          done

      - name: Package
        run: |
          mkdir -p dist/rc-rocket
          # The admin (assets/admin/app.js, panels.js) is committed as plain
          # JavaScript and shipped as is. admin-src/ predates that and must
          # not be rebuilt over it.
          rsync -a --exclude node_modules --exclude dist --exclude .git \
            --exclude .github --exclude .gitignore --exclude package.json \
            --exclude package-lock.json --exclude admin-src --exclude tests \
            --exclude deploy --exclude tools --exclude DOCUMENTATION.md ./ dist/rc-rocket/
          cd dist && zip -rq "rc-rocket-${VERSION}.zip" rc-rocket && rm -rf rc-rocket

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rc-rocket-${{ env.VERSION }}.zip
          generate_release_notes: true
          prerelease: true
